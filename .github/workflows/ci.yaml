# This is CI for todoapp
name: CI - Build & Push Nginx Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch: 
    inputs:
      example_input:
        description: 'An example input for the workflow'
        required: true
        default: 'default_value'

env:
  AWS_REGION: us-east-1 # Replace with your AWS region
  ECR_REPOSITORY: mypy # Replace with your ECR repository name
  IMAGE_TAG: ${{ github.sha }}
  ECR_REGISTRY: public.ecr.aws/${{ secrets.YOUR_ACCOUNT_ID }} # Replace with your public registry URL

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sruthi/todoapp-app:latest .

      # Step 2: Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
         aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
         aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
         aws-region: ${{ env.AWS_REGION }}

      # Step 3: Login to Amazon ECR Public
      - name: Login to Amazon ECR Public
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      # Step 4: Build, tag, and push Docker image
      - name: Build, tag, and push image to Amazon ECR Public
    
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

